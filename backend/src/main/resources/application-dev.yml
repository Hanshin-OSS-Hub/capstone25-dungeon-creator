spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dungeon_knight_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 테이블을 자동 생성/수정
    show-sql: true # 쿼리 로그 확인용
    properties:
      hibernate:
        format_sql: true
